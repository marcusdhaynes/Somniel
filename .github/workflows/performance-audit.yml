name: Performance Audit
on:
  workflow_run:
    workflows: ["Deploy to somniel.com"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '19 13 * * 1'
permissions:
  contents: read
concurrency:
  group: somniel-performance-audit
  cancel-in-progress: true
jobs:
  public-performance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Chrome
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Audit public routes (mobile Lighthouse)
        shell: bash
        run: |
          mkdir -p lighthouse-results
          for pair in "home:/" "projects:/projects/" "founders:/founders/"; do
            name="${pair%%:*}"
            path="${pair#*:}"
            npx --yes lighthouse@12.8.2 "https://somniel.com${path}" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance --quiet --output=json \
              --output-path="lighthouse-results/${name}.json" || echo "::warning::Lighthouse failed for ${name}"
          done
      - name: Summarize measured performance
        run: node scripts/summarize-lighthouse.mjs
      - name: Preserve Lighthouse audits
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: somniel-lighthouse-mobile
          path: lighthouse-results/
          if-no-files-found: ignore
          retention-days: 14
