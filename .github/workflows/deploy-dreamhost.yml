name: Deploy to somniel.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent a superseded build from replacing a newer production release.
concurrency:
  group: somniel-dreamhost-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify original and international hiring contracts are isolated
        run: node scripts/verify-contract-separation.mjs

      - name: Verify contractor visibility and incomplete drafts
        run: node --import tsx scripts/verify-workforce-drafts.mjs

      - name: Verify PayScale component references
        run: node scripts/verify-payscale-components.mjs

      - name: Build production bundle
        run: npm run build
        env:
          SOMNIEL_WEB: 'true'

      - name: Verify uniform compact public banner heights
        run: node scripts/verify-public-card-layout.mjs

      - name: Capture actual project application previews
        run: node scripts/capture-project-previews.mjs

      - name: Pre-render four public pages before React loads
        run: |
          node scripts/prerender-public.mjs dreamhost
          node scripts/verify-public-prerender.mjs dreamhost

      - name: Verify actual rendered card heights in headless Chrome
        run: node scripts/verify-rendered-banner-heights.mjs

      - name: Verify web paths, asset base, and Apache route fallback
        run: node scripts/verify-site-build.mjs dreamhost

      - name: Record production transfer sizes
        run: node scripts/report-bundle.mjs

      # NOTE (Oct 31, 2026): deploys with rsync over SSH using a dedicated
      # deploy key (DREAMHOST_SSH_KEY secret). Password-based SSH hung on
      # DreamHost's side, and FTP-Deploy-Action never supported SFTP.
      - name: Deploy to DreamHost over SSH (rsync + deploy key)
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Publish immutable chunks first so no new HTML references absent JS.
          # Do not delete old hashed assets: already-open tabs may still import
          # them when the user changes management pages.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/assets/ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/somniel.com/assets/"
          # Replace HTML/routes only after their chunks are in place. The
          # excluded assets directory is protected from --delete.
          rsync -avz --delete --exclude='.dh-diag' --exclude='assets/' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/somniel.com/"
          # Validate exact uploaded document root contains the SPA and its
          # Apache rewrite rules, not just a successfully transferred bundle.
          ssh -i ~/.ssh/deploy_key -p 22 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}" \
            'test -s /home/marcusdhaynes/somniel.com/index.html && test -s /home/marcusdhaynes/somniel.com/.htaccess'

      - name: HTTP smoke test direct public and protected routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /projects /founders /subsidiaries /dashboard /dashboard/files /admin /admin/settings; do
            tmp=$(mktemp)
            code=$(curl -sSL --retry 3 --retry-delay 2 --max-time 25 \
              -o "$tmp" -w '%{http_code}' "https://somniel.com$path")
            if [[ "$code" != "200" ]] || ! grep -q 'id="root"' "$tmp"; then
              echo "::error::https://somniel.com$path returned HTTP $code or not Somniel's application shell"
              head -c 400 "$tmp" || true
              rm -f "$tmp"
              exit 1
            fi
            echo "PASS https://somniel.com$path (HTTP $code)"
            rm -f "$tmp"
          done
