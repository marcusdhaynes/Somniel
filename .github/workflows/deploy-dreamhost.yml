name: Deploy to somniel.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # NOTE (Oct 31, 2026): SamKirkland/FTP-Deploy-Action does NOT support
      # SFTP/SSH at all — its protocol setting only accepts ftp/ftps/ftps-legacy
      # (its README points SSH users to a different action). DreamHost needs
      # SSH, so we deploy with rsync over SSH instead, reusing the same secrets.
      - name: Deploy to DreamHost over SSH (rsync)
        env:
          SSHPASS: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e rsync -avz --delete --exclude='.dh-diag' \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/somniel.com/"
